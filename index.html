<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>다함께 케어 - 우리가족 치매돌봄 기록장</title>
  
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Official Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tap-scale {
      transition: transform 0.12s ease-in-out;
    }
    .tap-scale:active {
      transform: scale(0.96);
    }
    @keyframes pulse-gentle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-pulse-gentle {
      animation: pulse-gentle 2s infinite ease-in-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

  <!-- Mobile App Container Frame -->

    <!-- TOP HEADER -->

  <!-- APPLICATION LOGIC & SUPABASE INTEGRATION -->
  <script>
    // =========================================================================
    // 1. SUPABASE SERVICE LAYER
    // =========================================================================
    const SUPABASE_CONFIG = {
      url: localStorage.getItem('supabase_url') || '',
      anonKey: localStorage.getItem('supabase_anon_key') || '',
      client: null,
      isConnected: false
    };

    const ELDER_UUID = 'a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d';

    function initSupabase() {
      if (window.supabase && SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey) {
        try {
          SUPABASE_CONFIG.client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
          SUPABASE_CONFIG.isConnected = true;
          updateDbBadge(true);
          setupRealtimeListeners();
          fetchFromSupabase();
          return true;
        } catch (e) {
          console.error('Supabase initialization failed:', e);
          SUPABASE_CONFIG.isConnected = false;
          updateDbBadge(false);
          return false;
        }
      } else {
        SUPABASE_CONFIG.isConnected = false;
        updateDbBadge(false);
        return false;
      }
    }

    function updateDbBadge(connected) {
      const indicator = document.getElementById('db-indicator');
      const text = document.getElementById('db-status-text');
      if (!indicator || !text) return;

      if (connected) {
        indicator.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-sm animate-pulse';
        text.innerText = '수파베이스 동기화';
      } else {
        indicator.className = 'w-1.5 h-1.5 rounded-full bg-slate-300';
        text.innerText = '로컬 모드 (설정)';
      }
    }

    // Fetch initial data from Supabase if connected
    async function fetchFromSupabase() {
      if (!SUPABASE_CONFIG.client) return;

      try {
        // 1. Fetch Health Record
        const todayStr = new Date().toISOString().split('T')[0];
        const { data: healthData, error: hErr } = await SUPABASE_CONFIG.client
          .from('health_records')
          .select('*')
          .eq('elder_id', ELDER_UUID)
          .eq('record_date', todayStr)
          .maybeSingle();

        if (healthData && !hErr) {
          STATE.health = {
            meds: healthData.meds || STATE.health.meds,
            mood: healthData.mood || STATE.health.mood,
            moodNote: healthData.mood_note || STATE.health.moodNote,
            meals: healthData.meals || STATE.health.meals,
            sleep: healthData.sleep || STATE.health.sleep,
            vital: healthData.vitals || STATE.health.vital
          };
        }

        // 2. Fetch Observation Diaries & Comments
        const { data: diariesData, error: dErr } = await SUPABASE_CONFIG.client
          .from('observation_diaries')
          .select(`
            *,
            diary_comments (*)
          `)
          .eq('elder_id', ELDER_UUID)
          .order('created_at', { ascending: false });

        if (diariesData && !dErr && diariesData.length > 0) {
          STATE.posts = diariesData.map(d => ({
            id: d.id,
            role: d.role_type,
            author: d.author,
            authorRole: d.author_role,
            time: formatTimeAgo(d.created_at),
            tag: d.tag,
            content: d.content,
            photos: d.photos || [],
            comments: (d.diary_comments || []).map(c => ({
              id: c.id,
              author: c.author,
              text: c.text,
              time: formatTimeAgo(c.created_at)
            }))
          }));
        }

        renderCurrentTab();
        showToast('☁️ 수파베이스 클라우드 데이터 동기화 완료!');
      } catch (err) {
        console.warn('Supabase fetch error, fallback to local:', err);
      }
    }

    // Setup Supabase Realtime Subscriptions
    function setupRealtimeListeners() {
      if (!SUPABASE_CONFIG.client) return;

      SUPABASE_CONFIG.client
        .channel('schema-db-changes')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'health_records' },
          () => fetchFromSupabase()
        )
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'observation_diaries' },
          () => fetchFromSupabase()
        )
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'diary_comments' },
          () => fetchFromSupabase()
        )
        .subscribe();
    }

    function formatTimeAgo(dateStr) {
      if (!dateStr) return '방금 전';
      const d = new Date(dateStr);
      return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    // =========================================================================
    // 2. STATE STORAGE & PERSISTENCE
    // =========================================================================

      role: localStorage.getItem('care_role') || 'family',
      tab: 'home',
      elder: {

        meals: {
          breakfast: '완식',
          lunch: '완식',
          dinner: '진행전'
        },
        sleep: '7.5시간 (기상 1회)',
        vital: {
          bp: '128 / 82',
          sugar: '112 mg/dL',
          temp: '36.5 ℃'
        }
      },
      posts: [
        {
          id: 1,
          role: 'center',

          authorRole: '화성남부 주간보호',
          time: '오늘 오후 2:15',
          tag: '인지재활 프로그램',
          content: '순자 어르신께서 오늘 가을 단풍 미술치료 활동에 정말 열정적으로 참여하셨습니다. 옛날 고향 화성 남양 장터 추억을 이야기하시며 다른 어르신들과도 도란도란 웃으셨어요. 점심 식사(소고기미역국, 계란찜)도 한 그릇 싹 비우셨습니다! 🍁',
          photos: [
            'https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?w=600&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600&auto=format&fit=crop&q=80'
          ],
          comments: [
            { id: 101, author: '딸 김영희', text: '선생님 항상 세심하게 챙겨주셔서 감사합니다! 💕', time: '오후 2:30' },
            { id: 102, author: '아들 김철수', text: '어머니 웃으시는 모습 보니 든든합니다.', time: '오후 3:10' }
          ]
        },
        {
          id: 2,
          role: 'family',
          author: '딸 김영희 (주보호자)',
          authorRole: '가족 보호자',
          time: '오늘 오전 8:40',
          tag: '가정 일상 & 투약',
          content: '어젯밤에는 한 번도 안 깨시고 푹 주무셨어요. 아침 혈압약과 치매 처방약(도네페질) 챙겨 드렸습니다. 복지관 셔틀버스 기사님 오셔서 반갑게 인사하며 탑승하셨습니다!',
          photos: [
            'https://images.unsplash.com/photo-1581579438747-1dc8d17bbce4?w=600&auto=format&fit=crop&q=80'
          ],
          comments: [
            { id: 201, author: '이지은 복지사', text: '네 어머님 센터에 잘 도착하셔서 따뜻한 결명자차 드시고 계십니다~^^', time: '오전 9:15' }
          ]
        },
        {

      if (savedPosts) STATE.posts = JSON.parse(savedPosts);
    } catch (e) {
      console.warn('Storage fallback', e);
    }

    async function saveState() {
      // 1. Always save to LocalStorage (Immediate offline reliability)
      try {
        localStorage.setItem('care_role', STATE.role);
        localStorage.setItem('care_health_data', JSON.stringify(STATE.health));
        localStorage.setItem('care_posts_data', JSON.stringify(STATE.posts));
      } catch (e) {
        console.warn('Storage write error', e);
      }

      // 2. Sync to Supabase if connected
      if (SUPABASE_CONFIG.client && SUPABASE_CONFIG.isConnected) {
        try {
          const todayStr = new Date().toISOString().split('T')[0];
          await SUPABASE_CONFIG.client
            .from('health_records')
            .upsert({
              elder_id: ELDER_UUID,
              record_date: todayStr,
              meds: STATE.health.meds,
              mood: STATE.health.mood,
              mood_note: STATE.health.moodNote,
              meals: STATE.health.meals,
              sleep: STATE.health.sleep,
              vitals: STATE.health.vital,
              updated_at: new Date().toISOString()
            }, { onConflict: 'elder_id,record_date' });
        } catch (err) {
          console.warn('Supabase sync error:', err);
        }
      }
    }

    // --- Toast Notification ---
    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-text');
      if (!box || !text) return;
      text.innerText = msg;
      box.classList.remove('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
      box.classList.add('opacity-100', 'translate-y-0');
      
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove('opacity-100', 'translate-y-0');
        box.classList.add('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
      }, 2500);
    }

        if (btn) {

            if (iconDiv) iconDiv.classList.add('bg-orange-100', 'text-orange-600');
          } else {
            btn.className = 'flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition-all tap-scale text-slate-500 hover:text-slate-700';

      renderCurrentTab();

      STATE.health.meds[`${key}Time`] = nowTime;
      saveState();
      showToast('투약 체크가 저장 및 동기화되었습니다.');

    // --- Add Comment ---

      const input = document.getElementById(`comment-input-${postId}`);

      const text = input.value.trim();
      const author = STATE.role === 'family' ? '딸 김영희 (가족)' : '이지은 복지사 (복지관)';

      const post = STATE.posts.find(p => p.id === postId);
      if (post) {
        if (!post.comments) post.comments = [];
        const newComment = {
          id: Date.now(),
          author: author,
          text: text,
          time: '방금 전'
        };
        post.comments.push(newComment);
        saveState();

        // Push to Supabase if valid UUID
        if (SUPABASE_CONFIG.client && typeof postId === 'string' && postId.includes('-')) {
          try {
            await SUPABASE_CONFIG.client.from('diary_comments').insert({
              diary_id: postId,
              author: author,
              text: text
            });
          } catch (e) {
            console.warn('Comment cloud insert error:', e);
          }

        showToast('댓글과 응원 메시지가 등록되었습니다.');

    function saveSupabaseSettings() {
      const url = document.getElementById('input-supabase-url').value.trim();
      const key = document.getElementById('input-supabase-key').value.trim();

      if (!url || !key) {
        alert('Supabase URL과 Anon Key를 모두 입력해주세요.');
        return;
      }

      SUPABASE_CONFIG.url = url;
      SUPABASE_CONFIG.anonKey = key;
      localStorage.setItem('supabase_url', url);
      localStorage.setItem('supabase_anon_key', key);

      const success = initSupabase();
      closeModal();
      if (success) {
        showToast('🎉 수파베이스 클라우드에 성공적으로 연결되었습니다!');
      } else {
        showToast('⚠️ 연결에 실패했습니다. URL과 Key를 확인해주세요.');
      }
      renderCurrentTab();
    }

    function disconnectSupabase() {
      SUPABASE_CONFIG.url = '';
      SUPABASE_CONFIG.anonKey = '';
      SUPABASE_CONFIG.client = null;
      SUPABASE_CONFIG.isConnected = false;
      localStorage.removeItem('supabase_url');
      localStorage.removeItem('supabase_anon_key');
      updateDbBadge(false);
      closeModal();
      showToast('로컬 저장소 모드로 전환되었습니다.');
      renderCurrentTab();
    }

                  'https://images.unsplash.com/photo-1581579438747-1dc8d17bbce4?w=600&auto=format&fit=crop&q=80'
                ].map((img) => `
                  <img src="${img}" alt="사진" onclick="selectPresetPhoto(this, '${img}')" class="w-full h-16 object-cover rounded-lg border-2 border-slate-200 cursor-pointer opacity-70 hover:opacity-100 transition-all" />
                `).join('')}
              </div>
            </div>
            <div class="pt-2 flex gap-2">
              <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold">취소</button>
              <button onclick="saveDiary()" class="flex-1 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold shadow-md">등록하기</button>
            </div>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function selectPresetPhoto(el, url) {
      const container = document.getElementById('photo-preset-group');
      if (!container) return;
      container.querySelectorAll('img').forEach(img => {
        img.className = 'w-full h-16 object-cover rounded-lg border-2 border-slate-200 cursor-pointer opacity-70 hover:opacity-100 transition-all';
      });
      if (selectedPresetPhoto === url) {
        selectedPresetPhoto = null;
      } else {
        selectedPresetPhoto = url;
        el.className = 'w-full h-16 object-cover rounded-lg border-2 border-orange-500 ring-2 ring-orange-300 opacity-100';
      }
    }

    async function saveDiary() {
      const tag = document.getElementById('diary-tag').value;
      const content = document.getElementById('diary-content').value;
      if (!content.trim()) {
        alert('일지 내용을 입력해주세요.');
        return;
      }

      const authorName = STATE.role === 'family' ? '딸 김영희 (가족)' : '이지은 사회복지사 (복지관)';
      const authorRoleDesc = STATE.role === 'family' ? '가족 보호자' : '화성남부 주간보호';
      const photosArray = selectedPresetPhoto ? [selectedPresetPhoto] : [];

      const newPost = {
        id: Date.now(),
        role: STATE.role,
        author: authorName,
        authorRole: authorRoleDesc,
        time: '방금 전',
        tag: tag,
        content: content.trim(),
        photos: photosArray,
        comments: []
      };

      STATE.posts.unshift(newPost);
      saveState();

      // Cloud Push if Supabase connected
      if (SUPABASE_CONFIG.client && SUPABASE_CONFIG.isConnected) {
        try {
          const { data, error } = await SUPABASE_CONFIG.client
            .from('observation_diaries')
            .insert({
              elder_id: ELDER_UUID,
              role_type: STATE.role,
              author: authorName,
              author_role: authorRoleDesc,
              tag: tag,
              content: content.trim(),
              photos: photosArray
            })
            .select()
            .single();

          if (data && !error) {
            newPost.id = data.id; // update with DB UUID
          }
        } catch (e) {
          console.warn('Supabase diary insert error:', e);
        }
      }

      closeModal();
      showToast('새 관찰일지가 성공적으로 등록되었습니다!');
      renderCurrentTab();
    }

    function openPhotoModal(url) {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4 animate-fade-in" onclick="closeModal()">
          <img src="${url}" alt="확대 사진" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl object-contain" />
          <p class="text-white/80 text-xs mt-3">화면을 터치하면 닫힙니다</p>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      modal.classList.add('hidden');
    }

    function triggerEmergencyAlert() {
      showToast('🚨 [긴급 SOS] 가족 전원과 복지관에 긴급 위치 및 경보가 발송되었습니다!');
      closeModal();
    }

    function copyInviteCode() {
      navigator.clipboard?.writeText('HS-CARE-8291');
      showToast('가족 초대코드 [HS-CARE-8291]가 복사되었습니다!');
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      setRole(STATE.role);
      initSupabase();
    });
  </script>
</body>
</html>
